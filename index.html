<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webフォトブース</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <!-- 上の帯 -->
  <div class="band-top">
    <div class="band-top-inner">
      <span class="band-star">★</span>
      <span class="band-group">ポリゴンスター2</span>
      <span class="band-star">★</span>
    </div>
  </div>

  <!-- 撮影・プレビューエリア -->
  <div class="camera-area">
    <video id="video" autoplay playsinline></video>
    <canvas id="character"></canvas>
    <!-- 撮影後の静止画 -->
    <img id="preview" style="display:none;">
  </div>

  <!-- 下の帯 -->
  <div class="band-bottom">
    <span class="band-school">中央情報大学校</span>
    <div class="controls">
      <!-- 撮影 / 保存ボタン（状態で切替） -->
      <button class="shutter-btn" id="captureBtn"></button>
      <a id="saveBtn" class="save-btn-circle" style="display:none;" download="photo.png">↓</a>
      <!-- カメラ切替 -->
      <button class="circle-btn" id="changeCameraBtn">⇄</button>
    </div>
  </div>

</div>

<!-- モーダル（残す） -->
<div class="modal" id="modal">
  <div class="modal-content">
    <img id="result">
    <div class="modal-buttons">
      <a id="modalSaveBtn" class="save-btn" download="photo.png">保存する</a>
      <button class="close-btn" id="closeBtn">閉じる</button>
    </div>
  </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>
<script src="script.js"></script>
</body>
</html>
